name: Sync upstream and build

on:
  schedule:
    - cron: "17 * * * *"   # 每小时；按需改，注意 cron 是 UTC
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # fork 的默认分支；main/master 按实际改
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/byJoey/cfnew.git || git remote set-url upstream https://github.com/byJoey/cfnew.git
          git fetch upstream

      - name: Sync if upstream changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE=$(git rev-parse HEAD)
          UP=$(git rev-parse upstream/main)   # 上游默认分支按实际改

          if [ "$BASE" = "$UP" ]; then
            echo "No upstream changes."
            exit 0
          fi

          # 只 fast-forward：你有本地提交导致分叉时会失败，避免悄悄生成合并提交
          git merge --ff-only upstream/main
          git push origin HEAD:main
          echo "Synced and pushed; downstream push workflow should now run."
